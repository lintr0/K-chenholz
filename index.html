<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballon d’Or Social</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0906;--card:#16120b;--gold:#d4af37;--g2:#f6e27a;--tx:#f3ead2;--mu:#9c917a;--bd:#3a2f14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a2110,var(--bg) 60%) fixed;color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,.logo{font-family:'Playfair Display',Georgia,serif;margin:.2em 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#0b0906ee;border-bottom:1px solid var(--bd)}
.logo{font-size:20px;color:var(--gold)}.logo span{color:var(--tx);font-weight:600;font-size:13px;letter-spacing:3px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--tx);padding:6px 12px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{border-color:var(--gold);color:var(--g2)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.b,.b2{border-radius:22px;padding:8px 16px;font:600 14px Inter,sans-serif;cursor:pointer}
.b{background:linear-gradient(135deg,var(--gold),var(--g2));color:#1a1405;border:0}
.b2{background:none;border:1px solid var(--gold);color:var(--g2)}
input,textarea,select{background:#0f0c07;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;max-width:100%}
input[type=color]{padding:0;width:44px;height:30px}textarea{width:100%;min-height:60px}
input:not([type]),input[type=text],input[type=password],input[type=email],input[type=number]{flex:1;min-width:120px}
.mu{color:var(--mu)}.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--gold),#7a5c10);color:#1a1405;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--gold);flex:none}
.hd{cursor:pointer}.pi{width:100%;border-radius:10px;margin:8px 0;display:block}
.lk{background:none;border:0;color:var(--tx);cursor:pointer;font-size:15px}.cm{font-size:14px;margin:3px 0}
.people{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.people div{text-align:center;cursor:pointer;font-size:12px;flex:none}
.login{max-width:380px;margin:8vh auto;text-align:center;padding:16px}.login h1{font-size:38px;color:var(--gold);letter-spacing:2px}
.bn{width:100%;aspect-ratio:10/3;object-fit:cover;border-radius:14px;background:linear-gradient(120deg,#2a2110,var(--gold) 50%,#2a2110);display:block}
.ph{display:flex;gap:14px;align-items:flex-end;margin:-40px 16px 10px;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{border:1px solid var(--gold);border-radius:12px;padding:6px 10px;font-size:13px;background:#1d1708}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.st{display:grid;grid-template-columns:1fr 340px;gap:14px}@media(max-width:760px){.st{grid-template-columns:1fr}}
.ctl{max-height:75vh;overflow:auto}.ctl h3{color:var(--gold);font-family:'Playfair Display',serif;margin:12px 0 4px}
.ctl label.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
#cv canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);touch-action:none;display:block;cursor:grab}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
code{color:var(--g2);font-size:15px;letter-spacing:2px}.err{color:#ff7b7b}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chip{background:#0f0c07;color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:5px 11px;font:13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--g2));color:#1a1405;border-color:var(--gold);font-weight:600}.chip i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;display:inline-block}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #555;cursor:pointer;display:inline-block}.sw.on{border-color:var(--g2);box-shadow:0 0 0 2px var(--gold)}
.stage{position:sticky;top:70px;align-self:start}#cv canvas{box-shadow:0 0 40px #d4af3733}.st{grid-template-columns:1fr 380px}
.tag{font-size:10px;border:1px solid var(--gold);color:var(--g2);border-radius:8px;padding:0 5px;margin-left:4px;letter-spacing:1px;font-weight:600;vertical-align:middle}
.q{padding:12px 0;border-top:1px solid var(--bd)}details{margin-top:6px;font-size:13px}summary{cursor:pointer}ol{margin:6px 0;padding-left:22px}
.sub{margin:18px 0 4px;padding-top:10px;border-top:1px solid var(--gold);font:700 17px 'Playfair Display',Georgia,serif;color:var(--g2)}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AW=['Goal of the Day-Award','Ballon d’Or','Puskás Award','Captain Award','Best Matchday Performance Award','Beste Entwicklungs Award','Best Defensive Player Award','Best Shot Award','Best Goalkeeper Award','Highest Speed Award','Best Assister Award','Best Dribbler Award'];
const IC=['🥅','🏆','🚀','🎖️','⭐','📈','🛡️','👟','🧤','⚡','🎯','🪄'];
const TEAMS="Algerien:fff:0a7f3f;Argentinien:75aadb:fff;Australien:ffcd00:00843d;Österreich:d6001c:fff;Belgien:d3151f:111;Bosnien-Herzegowina:1d4ea1:ffd400;Brasilien:ffdc02:0a8f3c;Kanada:d52b1e:fff;Kap Verde:003893:fff;Kolumbien:fcd116:003893;Kroatien:fff:e30613;Curaçao:0b2f8a:ffd200;Tschechien:d7141a:11457e;DR Kongo:f7d618:ce1021;Ecuador:ffdd00:0033a0;Ägypten:d71920:111;England:fff:1c2c5b;Frankreich:1d2f6f:fff;Deutschland:fff:111;Ghana:fff:ce1126;Haiti:00209f:d21034;Iran:fff:d0001b;Irak:0a7f3f:fff;Elfenbeinküste:f77f00:fff;Japan:1d3a8a:fff;Jordanien:fff:d21034;Mexiko:0a6b3a:fff;Marokko:c1272d:0a6b3a;Niederlande:f36c21:111;Neuseeland:fff:111;Norwegen:ba0c2f:00205b;Panama:d21034:00529b;Paraguay:d52b1e:fff;Portugal:b0122c:0a6b3a;Katar:8a1538:fff;Saudi-Arabien:fff:006c35;Schottland:0b2a6b:fff;Senegal:fff:00853f;Südafrika:ffb81c:00693e;Südkorea:d02030:111;Spanien:c60b1e:ffc400;Schweden:fecc02:006aa7;Schweiz:d52b1e:fff;Tunesien:e70013:fff;Türkei:e30a17:fff;USA:fff:0a3161;Uruguay:75aadb:111;Usbekistan:fff:1eb53a".split(';').map(t=>{const[n,m,x]=t.split(':');return{n,m:'#'+m,t:'#'+x}});
const SEED={Frederik:'345343',Lino:'156687',Hannes:'269763',Hugo:'016666',Lorenz:'268199',Georg:'048043',Albert:'584959',Jonathan:'377452',Johann:'264984',Benedikt:'602388'};
const defC=()=>({skin:'#e0ac69',face:0,eye:'#3b2a1a',mouth:0,nose:1,hair:1,hc:'#2b1b10',brow:0,beard:0,team:18,shoe:'#111111',pants:'#111111',glove:0,hat:0,hatc:'#d4af37',glass:0,ring:0,ear:0,brace:0,tt:0,lip:0,lt:0,ball:0,km:0,kp:1,kni:2,k1:'#1c2c5b',k2:'#ffffff',k3:'#d4af37',ks:0,nsh:0,ncol:'#ffffff',nf:0,fn:0,nmm:0,cnm:'',nmc:'#ffffff',sp:'',lg:0,lc:'#d4af37',lp:0,ls:1,lgi:'',bd:1,ht:1,eyes:0,ears:0,fr:0,sc:0,fp:0,var:0,col:0,sl:0,num:10,pst:1,pt:1,ps:0,band:0,wr:0,nk:0,cap:0,th:0,ax:1});
let D;try{D=JSON.parse(localStorage.getItem('bdo2'))}catch(e){}
if(!D)D={users:Object.entries(SEED).map(([n,c],i)=>({id:'u'+i,name:n,code:c,bio:'',av:'',bn:'',ch:defC()})),aw:[],posts:[]};
/* ===== CLOUD-SYNC (Supabase) – hier deine Daten eintragen, siehe README ===== */
const CLOUD={url:'',key:''};
const cl=!!(CLOUD.url&&CLOUD.key),CH={apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'Content-Type':'application/json'};
let dirty=0,tm,last='',loaded=!cl;
const push=()=>{dirty=1;clearTimeout(tm);tm=setTimeout(async()=>{try{await fetch(CLOUD.url+'/rest/v1/kv?on_conflict=id',{method:'POST',headers:{...CH,Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{id:'main',data:D}])});last=JSON.stringify(D)}catch(e){}dirty=0},800)};
async function pull(first){if(!cl||dirty)return;try{const r=await(await fetch(CLOUD.url+'/rest/v1/kv?id=eq.main&select=data',{headers:CH})).json();
 if(r[0]){const t=JSON.stringify(r[0].data);if(t!=last){last=t;D=r[0].data;ensureBots();try{localStorage.setItem('bdo2',t)}catch(e){}
  if(!first&&V.p!='studio'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}}
 else if(first){ensureBots();push()}}catch(e){}
 if(first){loaded=true;render()}}
function cloudInit(){if(!cl)return;pull(1);setInterval(pull,8000)}
const save=()=>{try{localStorage.setItem('bdo2',JSON.stringify(D))}catch(e){toast('Speicher voll – bitte kleinere Bilder verwenden.')}if(cl)push()};
let S=null;try{S=JSON.parse(sessionStorage.getItem('bdos'))}catch(e){}
const setS=v=>{S=v;try{sessionStorage.setItem('bdos',JSON.stringify(v))}catch(e){}};
const ME=()=>S&&!S.admin?D.users.find(u=>u.id===S.id):null,UN=id=>id=='admin'?'Admin':(D.users.find(u=>u.id==id)||{}).name||'?';
let V={p:'feed'},sel=new Set(),pz=0,fk='head',LT=0;
const go=(p,u)=>{V={p,u};render()};
const avH=(u,s)=>u&&u.av?`<img class=av style="width:${s}px;height:${s}px" src="${u.av}">`:`<div class=av style="width:${s}px;height:${s}px;font-size:${s/2}px${u?.col?';background:'+u.col:''}">${u?.em||E((u?.name||'?')[0])}</div>`;
const rd=(f,m,cb)=>{if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)};

function render(){render0();try{hyd()}catch(e){}}
function render0(){
 const app=$('#app');
 if(!loaded){app.innerHTML='<p class=mu style="text-align:center;margin-top:20vh">Lade…</p>';return}
 if(!S||(!S.admin&&!ME())){S=null;app.innerHTML=`<div class=login><h1>BALLON D’OR</h1><p class=mu>Die Social-Plattform für Champions</p><div class=card>
 <div class=row style="justify-content:center"><button class="${LT?'b2':'b'}" onclick="LT=0;render()">Spieler</button><button class="${LT?'b':'b2'}" onclick="LT=1;render()">Admin</button></div>
 ${LT?`<div class=row><input id=em type=email placeholder="E-Mail"></div><div class=row><input id=pw type=password placeholder="Passwort"></div><button class=b onclick=lg()>Als Admin einloggen</button>`
 :`<div class=row><input id=cd placeholder="Dein 6-stelliger Code" inputmode=numeric maxlength=6></div><button class=b onclick=lg()>Einloggen</button>`}<p id=le class=err></p></div></div>`;return}
 const me=ME(),on=p=>V.p==p?'on':'';
 app.innerHTML=`<header><div class=logo>⚽ <b>BALLON D’OR</b> <span>SOCIAL</span></div><nav><button class="${on('feed')}" onclick="go('feed')">Feed</button><button class="${on('disc')}" onclick="go('disc')">Entdecken</button>${me?`<button class="${V.p=='prof'&&V.u==me.id?'on':''}" onclick="go('prof','${me.id}')">Profil</button><button class="${on('studio')}" onclick="go('studio')">3D-Studio</button><button class="${on('polls')}" onclick="go('polls')">Umfragen${unans(me)?' ('+unans(me)+')':''}</button>`:`<button class="${on('admin')}" onclick="go('admin')">Admin</button><button class="${on('polls')}" onclick="go('polls')">Umfragen</button>`}<button onclick="setS(null);render()">Logout</button></nav></header><main id=main></main>`;
 if(V.p=='studio'&&me)return studio(me);
 if(V.p=='admin'&&S.admin)return $('#main').innerHTML=adminH();
 if(V.p=='prof')return $('#main').innerHTML=profH(V.u,me);
 if(V.p=='disc')return $('#main').innerHTML=discH();
 if(V.p=='polls')return $('#main').innerHTML=me?pollH(me):pollA();
 $('#main').innerHTML=feedH(me);
}
function lg(){
 if(LT){if($('#em').value.trim().toLowerCase()=='linobirke@gmail.com'&&$('#pw').value=='florin2010G'){setS({admin:1});V={p:'admin'};return render()}}
 else{const u=D.users.find(x=>x.code==$('#cd').value.trim());if(u){setS({id:u.id});sel=new Set();V={p:'feed'};return render()}}
 $('#le').textContent='Zugangsdaten falsch.'}
const pH=p=>{const u=D.users.find(x=>x.id==p.u),k=S.admin?'admin':S.id;return `<article class=card><div class="row hd" onclick="${u?`go('prof','${p.u}')`:''}">${avH(u||{name:'Admin'},40)}<b>${E(UN(p.u))}</b>${u&&u.bot?'<span class=tag>FAN</span>':''}<span class=mu style="margin-left:auto;font-size:12px">${ago(p.ts)}</span></div>${p.img?`<img class=pi src="${p.img}">`:''}${p.t?`<p>${E(p.t)}</p>`:''}<div class=row><button class=lk onclick="lk('${p.id}')">${p.l.includes(k)?'❤️':'🤍'} ${p.l.length}</button>${S.admin||p.u==k?`<button class=lk onclick="delP('${p.id}')">🗑</button>`:''}</div>${p.c.map(c=>`<div class=cm><b>${E(c.n)}</b>${c.u?'<span class=tag>FAN</span>':''} ${E(c.t)}</div>`).join('')}<div class=row><input id="c${p.id}" placeholder="Kommentieren…"><button class=b2 onclick="com('${p.id}')">Senden</button></div></article>`};
function feedH(me){return `<div class=people>${D.users.filter(u=>!u.bot).map(u=>`<div onclick="go('prof','${u.id}')">${avH(u,58)}${E(u.name)}</div>`).join('')}</div>`+
 (`<div class=card><textarea id=pt placeholder="Was passiert gerade, ${E(me?me.name:'Admin')}?"></textarea><div class=row><input type=file id=pf accept="image/*"><button class=b onclick=post()>Posten</button></div></div>`)+
 feedL(me)}
function post(){const t=$('#pt').value.trim(),f=$('#pf').files[0],add=img=>{const id='p'+Date.now();D.posts.push({id,ts:Date.now(),u:S.admin?'admin':S.id,t,img,l:[],c:[]});save();render();toast('Gepostet!');react(id)};if(f)rd(f,900,add);else if(t)add('');else toast('Schreibe etwas oder wähle ein Bild.')}
function lk(id){const p=D.posts.find(x=>x.id==id),k=S.admin?'admin':S.id,i=p.l.indexOf(k);i<0?p.l.push(k):p.l.splice(i,1);save();render()}
function com(id){const v=$('#c'+id).value.trim();if(!v)return;D.posts.find(x=>x.id==id).c.push({n:S.admin?'Admin':ME().name,t:v});save();render()}
function delP(id){ask('Beitrag löschen?',()=>{D.posts=D.posts.filter(x=>x.id!=id);save();render()})}
function profH(id,me){const u=D.users.find(x=>x.id==id);if(!u)return'';const own=me&&me.id==id,aw=D.aw.filter(a=>a.uid==id),ps=D.posts.filter(p=>p.u==id&&p.img);
 return (u.bn?`<img class=bn src="${u.bn}">`:'<div class=bn></div>')+`<div class=ph>${avH(u,96)}<div><h2>${E(u.name)}${u.bot?'<span class=tag>FAN</span>':''}</h2><span class="hd mu" onclick="showL('${id}',0)"><b style="color:var(--tx)">${nF(u)}</b> Follower</span> · <span class="hd mu" onclick="showL('${id}',1)"><b style="color:var(--tx)">${nG(u)}</b> Folge ich</span> ${me&&!own?`<button class="${isF(me,u)?'b2':'b'}" onclick="fw('${id}')">${isF(me,u)?'Entfolgen':'Folgen'}</button>`:''}</div></div><p style="margin:0 16px 14px">${E(u.bio)||'<span class=mu>Keine Bio.</span>'}</p>`+
 (own?`<div class=card><h2>Profil bearbeiten</h2><div class=row><input id=pn value="${E(u.name)}" maxlength=24></div><textarea id=pb maxlength=200 placeholder="Bio">${E(u.bio)}</textarea>
 <div class=row><label>Profilbild <input type=file accept="image/*" onchange="upI(this,'av',300)"></label><label>Banner <input type=file accept="image/*" onchange="upI(this,'bn',1200)"></label></div><button class=b onclick=saveP()>Speichern</button></div>`:'')+
 `<div class=card><h2>Awards (${aw.length})</h2><div class=badges>${aw.map(a=>`<div class=badge>${IC[a.a]} ${AW[a.a]}<br><span class=mu>Saison ${E(a.s)}${a.m?' · Spieltag '+E(a.m):''}</span></div>`).join('')||'<span class=mu>Noch keine Awards.</span>'}</div></div>`+
 D.posts.filter(p=>p.u==id).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10).map(pH).join('')}
function saveP(){const u=ME();u.name=$('#pn').value.trim()||u.name;u.bio=$('#pb').value;save();render()}
function upI(el,k,m){rd(el.files[0],m,d=>{ME()[k]=d;save();render()})}

/* ---------- BOTS / FOLGEN ---------- */
let FT=0,BON=true;
const BOTS=()=>D.users.filter(u=>u.bot),pick=a=>a[Math.floor(Math.random()*a.length)],rn=n=>Math.floor(Math.random()*n),isBot=id=>!!(D.users.find(u=>u.id==id)||{}).bot,
isF=(a,b)=>a.id!=b.id&&((a.bot&&!b.bot)||(a.fo||[]).includes(b.id)),nF=u=>D.users.filter(x=>isF(x,u)).length,nG=u=>D.users.filter(x=>isF(u,x)).length;
const FN=['Max','Luca','Emma','Jonas','Mia','Finn','Lea','Paul','Anna','Ben','Noah','Sofia','Leon','Emil','Hanna','Felix','Mila','Tim','Nele','Ole','Jana','Elias','Lina','Moritz','Clara','Tom','Ida','Ali','Yusuf','Aylin','Marco','Giulia','Pedro','Sven','Katja','Dario','Nils','Zoe','Arda','Maja'],
SF=['Tor','Fan','Ultra','Kurve','Flanke','Libero','Elfer','Derby','Pokal','Hattrick','Grätsche','Rasen','Anstoß','Dribbel','Kapitän','Nordkurve','Südtribüne','Torjäger','Außenrist','Volley'],
EM=['⚽','🔥','🏆','🥅','👟','🧤','🦁','🐺','🦅','⭐','💛','🖤','❤️','💙','🐐','👑'],CO=['#7a5c10','#8a2b2b','#1c2c5b','#0a6b3a','#5a2a7a','#b0122c','#2a6d8a','#6b4a1e','#444444','#a14a0a'],
BIO=['Fußballfan durch und durch ⚽','Dauerkarte seit 2015 🎟️','Hobby-Torwart 🧤','Ballon-d’Or-Experte 🏆','Kommentiere jedes Spiel 📣','Nur für die Kurve 🔥','Tore, Tore, Tore!','Wochenende = Fußball','Fan seit Tag 1 ❤️','FIFA-Profi (im eigenen Kopf)'],

async function addMedia(files,target){
 for(const f of files){const vid=(f.type||'').startsWith('video/'),img=(f.type||'').startsWith('image/');
  if(!vid&&!img){toast('Nur Fotos und Videos erlaubt.');continue}
  if(f.size>MAXB){toast('Datei ist größer als 50 MB: '+f.name);continue}
  try{let blob=f;
   if(vid){const d=await vdur(f);if(!(d<=MAXS+.4)){toast(`Video ist zu lang (${Math.round(d)} s, max. 20 s): ${f.name}`);continue}}
   else blob=await new Promise(r=>rd(f,1400,u=>fetch(u).then(x=>x.blob()).then(r)));
   const id='m'+Date.now().toString(36)+rn(1e6).toString(36);toast('Lade hoch…');
   if(cl){const r=await fetch(`${CLOUD.url}/storage/v1/object/media/${id}`,{method:'POST',headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'Content-Type':blob.type||f.type,'x-upsert':'true'},body:blob});if(!r.ok)throw new Error('Upload '+r.status)}
   else await idbPut(id,blob);
   target({id,t:vid?'v':'i',c:cl?1:0})}
  catch(e){toast('Upload fehlgeschlagen: '+(e.message||e))}}
 render()}
